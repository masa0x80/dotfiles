[lint.md007]
# after/ftplugin/markdown.lua の shiftwidth (2) に合わせる
indent = 2

# NOTE: MD031 (blanks-around-fences) の list_items オプションは mado 未対応のため、
# 旧 .markdownlint.jsonc にあった「リスト内のコードブロック前後は空行不要」は再現できていない
