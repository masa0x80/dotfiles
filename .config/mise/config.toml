[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "7d"
paranoid = true
disable_backends = ["asdf"]

[settings.github]
use_git_credentials = true

[settings.node]
gpg_verify = false

[tools]
"aqua:aws/session-manager-plugin" = "latest"

awscli = "latest"
aws-sam-cli = "latest"
aws-vault = "latest"

gh = "latest"

go = "latest"
"go:github.com/rhysd/vim-startuptime" = "latest"
"go:github.com/sotarok/gw" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"

java = "latest"
gradle = "latest"
groovy = "latest"

jq = "latest"
yq = "latest"

lefthook = "latest"

# https://github.com/neovim/neovim/releases
neovim = "latest"

# NOTE: textlint はルールと同じ場所にインストールする必要があるので npm: backend にしない
node = { version = "latest", postinstall = 'xargs npm install -g < "$HOME/.config/mise/default-npm-packages"' }
"npm:oxfmt" = "latest"
"npm:prettier" = "latest"
"npm:tsx" = "latest"

op = "latest"

python = { version = "latest", postinstall = 'python -m pip install -r "$HOME/.config/mise/default-python-packages"' }
uv = "latest"

ruby = { version = "latest", postinstall = 'xargs gem install < "$HOME/.config/mise/default-gems"' }

rust = "latest"

sops = "latest"

terraform = "latest"
terraform-docs = "latest"
tflint = "latest"

tree-sitter = "latest"
