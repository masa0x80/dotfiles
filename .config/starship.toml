continuation_prompt = '[❯❯ ](purple)'

palette = "catppuccin_mocha"

# herdrのセッション復元時に複数paneが同時起動し、プロセス生成が詰まるので設定値を変更する
command_timeout = 1000
scan_timeout = 100

format = """
$username\
$hostname\
$directory\
$git_branch\
${custom.git_detached}\
${custom.jj}\
$git_status\
$cmd_duration\
$line_break\
$python\
${env_var.STARSHIP_FACE_OK}\
${env_var.STARSHIP_FACE_NG}\
$character"""

[directory]
style = "blue"

# 顔はコマンド実行ごとに zsh 側（zsh.d/prompt.zsh）で切り替えて環境変数で渡す
# 成功時は STARSHIP_FACE_OK、失敗時は STARSHIP_FACE_NG のどちらか一方だけが設定される
[env_var.STARSHIP_FACE_OK]
format = "[$env_value]($style)"
style = "purple"

[env_var.STARSHIP_FACE_NG]
format = "[$env_value]($style)"
style = "red"

[character]
success_symbol = "[:匚＞](purple)"
error_symbol = "[X匚＞](red)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"

[custom.jj]
# shell の bash でそのまま読み込み、bash を二重に起動しない
command = ". $HOME/.config/starship/jj.sh"
# .jj の有無は jj.sh 側で判定する（when でシェルを起動するとその分遅くなる）
when = true
shell = ["bash", "--noprofile", "--norc"]
# when = true なので jj repo 外でも module が出る。出力が空なら空白も出さない
format = "($output )"
unsafe_no_escape = true

[git_branch]
format = "[$branch]($style) "
style = "green"
# jj colocated では HEAD が常に detached なので、custom.jj が change を出す
only_attached = true

[custom.git_detached]
# 判定は git-detached.sh 側で行う（when でシェルや git を起動するとその分遅くなる）
command = ". $HOME/.config/starship/git-detached.sh"
require_repo = true
when = true
shell = ["bash", "--noprofile", "--norc"]
# 出力が空（attached や jj repo 内）なら何も出さない
format = "([:$output]($style) )"
style = "bold mauve"

[git_status]
format = '([$ahead_behind$all_status]($style) )'
style = "fg"
use_git_executable = true
conflicted = "[✖$count](bold red)"
staged = "[●$count](bold green)"
modified = "[✚$count](bold yellow)"
untracked = "[…$count](bold mauve)"
deleted = "[✖$count](red)"
renamed = "[»$count](bold teal)"
stashed = "[⚑$count](bold blue)"
ahead = "[↑·$count](fg)"
behind = "[↓·$count](fg)"
diverged = "[↓·$behind_count↑$ahead_count](fg)"
up_to_date = ""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
mauve = "#cba6f7"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
blue = "#89b4fa"
fg = "#cdd6f4"
