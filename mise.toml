# dotfiles {{{

[dotfiles]
"~/.bashrc" = { source = ".bashrc", mode = "symlink" }
"~/.bin" = { source = ".bin", mode = "symlink" }
"~/.cargo" = { source = ".cargo", mode = "symlink" }
"~/.config" = { source = ".config", mode = "symlink" }
"~/.curlrc" = { source = ".curlrc", mode = "symlink" }
"~/.default-cargo-crates" = { source = ".default-cargo-crates", mode = "symlink" }
"~/.default-gems" = { source = ".default-gems", mode = "symlink" }
"~/.default-go-packages" = { source = ".default-go-packages", mode = "symlink" }
"~/.default-npm-packages" = { source = ".default-npm-packages", mode = "symlink" }
"~/.default-python-packages" = { source = ".default-python-packages", mode = "symlink" }
"~/.direnvrc" = { source = ".direnvrc", mode = "symlink" }
"~/.editorconfig" = { source = ".editorconfig", mode = "symlink" }
"~/.editrc" = { source = ".editrc", mode = "symlink" }
"~/.irbrc" = { source = ".irbrc", mode = "symlink" }
"~/.myclirc" = { source = ".myclirc", mode = "symlink" }
"~/.npmrc" = { source = ".npmrc", mode = "symlink" }
