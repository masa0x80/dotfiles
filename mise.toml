path = ["65"]
value = { enabled = false, value = { parameters = [65535, 49, 1572864], type = "standard" } }

# CleanShotを使用するためScreenshot and recording optionsを無効化
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["28"]
