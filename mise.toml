# passage はHomebrewやmiseで配布されていないので、cloneして post-repos hook で ~/.local にインストールする
# NOTE: symlink だと $0 基準で platform/darwin.sh を探すため macOS 用の clip/getopt が読み込まれない
[bootstrap.repos."~/.ghq/github.com/FiloSottile/passage"]
url = "https://github.com/FiloSottile/passage.git"
ref = "1.7.4a2"

