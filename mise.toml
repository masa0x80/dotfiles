# macOS defaults {{{

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
IsAnalog = true
Show24Hour = true
ShowSeconds = true

[bootstrap.macos.defaults."com.apple.dock"]
# Dockのアイコンサイズ
tilesize = 48
# Dockの自動非表示
autohide = true
# アプリ起動時のアニメーション
launchanim = true
# 起動中アプリのインジケーターを表示
show-process-indicators = true
# 最近使ったアプリをDockに表示
show-recents = false
# 4本指スプレッドでデスクトップ表示
showDesktopGestureEnabled = true
# 4本指上下スワイプでMission Control
showMissionControlGestureEnabled = true
# App Exposéジェスチャー
showAppExposeGestureEnabled = false
# Launchpadジェスチャー
showLaunchpadGestureEnabled = false

# 内蔵トラックパッドとBluetoothトラックパッドで同じ設定にする
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
# タップでクリック
Clicking = true
# 2本指で右クリック
TrackpadRightClick = true
TrackpadCornerSecondaryClick = 0
# 調べる＆データ検出
ForceSuppressed = false
# 3本指タップでの調べるは無効
TrackpadThreeFingerTapGesture = 0
# 静音クリック（0: 有効, 1: 無効）
ActuationStrength = 0
FirstClickThreshold = 2
SecondClickThreshold = 2
# 拡大縮小 / スマートズーム / 回転
TrackpadPinch = true
TrackpadTwoFingerDoubleTapGesture = true
TrackpadRotate = true
# ページ間スワイプ無効、フルスクリーン切替は4本指横スワイプ
TrackpadThreeFingerHorizSwipeGesture = 0
TrackpadFourFingerHorizSwipeGesture = 2
# Mission Controlを4本指縦スワイプに割り当て
TrackpadThreeFingerVertSwipeGesture = 0
TrackpadFourFingerVertSwipeGesture = 2
# 慣性スクロール
TrackpadMomentumScroll = true
# 3本指ドラッグ
Dragging = false
TrackpadThreeFingerDrag = false

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
TrackpadRightClick = true
TrackpadCornerSecondaryClick = 0
ForceSuppressed = false
TrackpadThreeFingerTapGesture = 0
ActuationStrength = 0
FirstClickThreshold = 2
SecondClickThreshold = 2
TrackpadPinch = true
TrackpadTwoFingerDoubleTapGesture = true
TrackpadRotate = true
TrackpadThreeFingerHorizSwipeGesture = 0
TrackpadFourFingerHorizSwipeGesture = 2
TrackpadThreeFingerVertSwipeGesture = 0
TrackpadFourFingerVertSwipeGesture = 2
TrackpadMomentumScroll = true
Dragging = false
TrackpadThreeFingerDrag = false

[bootstrap.macos.defaults."com.apple.universalaccess"]
mouseDriverCursorSize = 3.0

[bootstrap.macos.defaults."com.apple.finder"]
# ソート時にフォルダを優先して表示
_FXSortFoldersFirst = true
# タイトルバーにフルパス表示
_FXShowPosixPathInTitle = true
# 隠しファイル表示
AppleShowAllFiles = true
# 拡張子を表示
AppleShowAllExtensions = true
# 拡張子変更の警告
FXEnableExtensionChangeWarning = false
# finderの終了ができるように
QuitMenuItem = true
# パスバーの有効化
ShowPathbar = true
# ステータスバーの有効化
ShowStatusBar = true
# デスクトップにディスクを表示しない
ShowExternalHardDrivesOnDesktop = false
ShowHardDrivesOnDesktop = false
ShowMountedServersOnDesktop = false
ShowRemovableMediaOnDesktop = false

[bootstrap.macos.defaults.NSGlobalDomain]
# 拡張子を常に表示
AppleShowAllExtensions = true
# ナチュラルスクロール
"com.apple.swipescrolldirection" = true
# ページ間スワイプを無効化
AppleEnableSwipeNavigateWithScrolls = false
# 音量変更時の音
"com.apple.sound.beep.feedback" = 0
# ダークモード
AppleInterfaceStyle = "Dark"
AppleKeyboardUIMode = 3
# キー長押し時のアクセント入力を有効化
ApplePressAndHoldEnabled = false
# 調べる＆データ検出
"com.apple.trackpad.forceClick" = false
"com.apple.trackpad.scaling" = 3.0
# キーリピート開始までの待ち時間
InitialKeyRepeat = 10
# キーリピート速度（小さいほど速い）
KeyRepeat = 1
# Cmd と Ctrl を押している時にのドラッグでウィンドウを移動できるように
NSWindowShouldDragOnGesture = true
# 入力補助の自動置換系を無効化
NSAutomaticCapitalizationEnabled = false
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticSpellingCorrectionEnabled = false

[bootstrap.macos.defaults."com.apple.desktopservices"]
# Avoid creating .DS_Store files on network or USB volumes
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.screencapture"]
name = "ScreenShot"
show-thumbnail = false

[bootstrap.macos.defaults."com.apple.AdLib"]
allowApplePersonalizedAdvertising = false

[bootstrap.macos.defaults."com.microsoft.VSCode"]
ApplePressAndHoldEnabled = false

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "AppleLanguages"
value = ["en", "ja"]

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "NSUserKeyEquivalents"
path = ["Minimize"]
value = "~@m"

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Music"
key = "AppleLanguages"
value = ["ja"]

# Spotlight検索を無効化
# ref. https://qiita.com/ry0f/items/f2c75f0a77b1012182d6
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
