key = "AppleSymbolicHotKeys"
path = ["27"]
value = { enabled = true, value = { parameters = [65535, 48, 524288], type = "standard" } }

# }}}

# Enable touch ID for sudo {{{

[bootstrap.files."/etc/pam.d/sudo_local"]
owner = "root"
group = "wheel"
mode = "0444"
# nix-darwin が張った /etc/static への symlink を置き換える
replace = true
content = """
# Written by mise bootstrap
auth       optional       /opt/homebrew/lib/pam/pam_reattach.so
auth       sufficient     pam_tid.so
"""

# }}}

[bootstrap.hooks]
# サードパーティのtapをHomebrewに信頼させる（未tapでも登録でき、登録済みなら何もしない）
pre-packages = "brew trust --tap daipeihust/tap ryooooooga/tap hanasuke/moralerspace"
post-packages = [
  # im-select の formula は sha256 が空で mise が評価できないので、brew で直接入れる
  # NOTE: [bootstrap.packages] に無いので `make brew-prune` では削除対象になる（次の make で入れ直される）
  "brew list --formula im-select >/dev/null 2>&1 || brew install daipeihust/tap/im-select",
  # openssl のメジャーバージョンが上がったら知らせる（"brew:openssl@N" を更新するかの判断用）
  # NOTE: [bootstrap.packages] のキーには変数を使えないので、宣言中のバージョンはキーから読み取る
  '''
declared=$(sed -n 's/^"brew:\(openssl@[0-9]*\)".*/\1/p' "{{ config_root }}/mise.toml")
latest=$(brew info openssl 2>/dev/null | sed -n '1s/^==> \([^:]*\):.*/\1/p')
[ -z "$latest" ] || [ "$latest" = "$declared" ] || echo "NOTE: openssl の最新は ${latest} です（mise.toml は ${declared}）"
''',
]
# NOTE: /usr/bin/make は xcode-select の shim なので、brew の gmake を使う
post-repos = "gmake -C ~/.ghq/github.com/FiloSottile/passage install PREFIX=$HOME/.local WITH_ZSHCOMP=yes WITH_BASHCOMP=no WITH_FISHCOMP=no"
post-dotfiles = "mkdir -p ~/ScreenShots"
# macOS設定を再起動なしで即時反映する
post-defaults = [
  "killall cfprefsd || true",
  "/System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u",
  "killall Dock || true",
]
